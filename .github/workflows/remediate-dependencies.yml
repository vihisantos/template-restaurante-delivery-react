name: Remediate dependency lockfile

on:
  push:
    branches: [ci/quality-gate-tests]
    paths:
      - .github/workflows/remediate-dependencies.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/quality-gate-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade Vite within a compatible major and update vulnerable transitive dependencies
        run: |
          npm install --save-dev 'vite@^7'
          npm audit fix
      - name: Verify lockfile and audit
        run: |
          npm ci
          npm audit --omit=dev
          npm run typecheck
          npm run build
      - name: Commit refreshed dependency manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate vulnerable npm dependencies"
          git push origin HEAD:ci/quality-gate-tests
